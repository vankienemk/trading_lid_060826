# =============================================================================
# V2 Pipeline — FROZEN CONFIGURATION
# =============================================================================
# This file captures the EXACT parameter set used in the V2 generalization
# test (cross-asset pooling of XAUUSD-OOS 2018→2022-06 + EURUSD 2018→2026).
# Frozen on 2026-09-05 — commits prior to this date may have been exploratory.
# Subsequent paper-trading may log per-trade features for post-mortem analysis
# but must NEVER alter these parameters while OOS data remain active.
#
# Git commit at freeze: <fill in during Phase 8 setup>
#
# References:
#   - pipeline_v2/src/events/sweep_detector_v2.py  (build_sweep_events_v2)
#   - pipeline_v2/scripts/run_pipeline_v2.py        (orchestration)
#   - pipeline_v2/scripts/analysis/cross_asset/     (validation reports)
# =============================================================================

project:
  symbol: XAUUSD
  secondary_symbol: EURUSD
  timeframe: M15
  timezone: UTC
  random_seed: 42

# --- Pipeline version selector ---
pipeline:
  version: v2
  freeze_date: "2026-09-05"
  freeze_commit: ""

# --- Sweep detection (build_sweep_events_v2) ---
sweep:
  v2_nguoc_trend: true           # V2 signature: counter-trend sweeps only
  v2_target_r: 3.0               # Primary R:R target (fixes v1's reward-endogeneity)
  min_penetration_atr: 0.05      # lower threshold for sweeping bar body entry
  max_penetration_atr: 0.20      # upper cap (v2 narrowing from v1's 0.50)
  min_wick_ratio: 0.35           # wick must be at least 35% of total bar range
  min_reclaim_atr: 0.00          # no reclaim requirement in v2 (V1 had it)
  cooldown_bars: 4               # min bars between sweep rows
  group_rule: first              # dedup: keep the FIRST bar of each cooldown run

# --- Confirmation ---
confirmation:
  enabled: true
  max_wait_bars: 3               # candles after sweep to form a signal bar
  require_break_sweep_extreme: true  # must trade beyond the sweep's extreme
  min_body_ratio: 0.60           # signal-bar body >= 60% of its full range
  min_range_atr: 0.80            # signal-bar range >= 0.80 × ATR(14)

entry:
  mode: next_open_after_confirmation
  slippage_price: 0.0
  spread_price: 0.0

stop:
  mode: sweep_extreme
  buffer_atr: 0.10

# --- Labeling / outcome simulation ---
labeling:
  horizons: [16]                 # 16 bars for time-barrier / m2m
  reward_r_values: [2.0]         # target reward expressed in risk units
  primary_horizon: 16
  primary_reward_r: 2.0
  same_bar_policy: ambiguous
  time_barrier_result: mark_to_market   # time-out → m2m at current price

costs:
  half_spread_price: 0.0
  slippage_price: 0.0
  commission_r: 0.0
  # NOTE: paper trading must replace these with broker-realistic costs,
  # then re-run the cost sensitivity to validate the 0.05R assumption.

indicators:
  atr_period: 14

# --- Position sizing (Phase 8 tentative) ---
position_sizing:
  XAUUSD: 1.0      # full unit
  EURUSD: 0.50     # 50 % of XAUUSD (due to weaker CI lower bound)

# --- Kill-switch ---
kill_switch:
  method: block_bootstrap        # rolling CI uses block bootstrap (not IID)
  block_size: 25                 # trades per block (from 2*sqrt(385) heuristic)
  min_trades: 50                 # minimum observations before kill-switch activates
  threshold_pf_ci_lower: 1.0     # stop if rolling 95% CI lower bound ≤ 1.0
  per_asset: true                # monitor XAUUSD and EURUSD independently